spring:
  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

app:
  trust-proxy-headers: ${APP_TRUST_PROXY_HEADERS:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    sms-provider: ${APP_AUTH_SMS_PROVIDER:http}
    sms-http:
      endpoint: ${APP_AUTH_SMS_HTTP_ENDPOINT}
      secret: ${APP_AUTH_SMS_HTTP_SECRET}
  tools:
    terminal:
      enabled: false
